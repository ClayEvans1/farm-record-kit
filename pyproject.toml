[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-record-kit"
version = "0.2.0"
description = "CSV templates, validation, and summaries for small-farm harvest, market, and expense records."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leah Cronkright" }]
keywords = ["farm", "market-garden", "csv", "recordkeeping", "agriculture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Text Processing :: General",
]

[project.scripts]
farm-record-kit = "farm_record_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
